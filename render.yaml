services:
  - type: web
    name: cricket2026-authoritative-server
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: TICK_RATE_HZ
        value: 30
      - key: DEFAULT_OVERS
        value: 5
      - key: RECONNECT_GRACE_MS
        value: 30000
      - key: MAX_ROOMS
        value: 100
